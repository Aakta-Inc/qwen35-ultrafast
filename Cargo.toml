[package]
name = "qwen35-ultrafast"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native reproducible Qwen3.5-4B inference experiments"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
png = "0.17"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json"] }
